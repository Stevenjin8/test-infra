org: istio
repo: proxy
support_release_branching: true

defaults:
  branches: [master]
  repo-allowlist: [proxy]
  modifier: master_priv

transforms:

# istio/proxy master test jobs(s) - presubmit(s)
- labels:
    preset-enable-netrc: "true"
  job-type: [presubmit]

# istio/proxy master build jobs(s) - postsubmit(s)
- env:
    R2_BUILD_BUCKET: istio-build-private
  labels:
    preset-enable-netrc: "true"
  job-type: [postsubmit]
  job-denylist: [update-istio_proxy]
  requirements: [cf-r2-istio-build-private-auth]
